[package]
name = "lipi_runtime"
description = "Interpreter, values and standard library for the Lipi language"
version.workspace = true
edition.workspace = true

[dependencies]
lipi_compiler = { path = "../compiler" }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
base64 = "0.22"
getrandom = "0.2"
# SQLite, compiled from source (needs a C compiler: MinGW GCC on Windows-GNU).
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = "0.2"
bytes = "1"
