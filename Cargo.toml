[workspace]
resolver = "2"
members = ["compiler", "runtime", "cli"]

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"

# Optimise dependencies even in debug builds, so hashing and SQLite stay fast.
[profile.dev.package."*"]
opt-level = 2
