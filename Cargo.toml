[workspace]
resolver = "2"
members = ["compiler", "runtime", "cli", "web"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Harsh Pal Singh (@iamharshpalsingh)"]
repository = "https://github.com/iamharshpalsingh/lipi"

[profile.release]
opt-level = 3
lto = "thin"

# Optimise dependencies even in debug builds, so hashing and SQLite stay fast.
[profile.dev.package."*"]
opt-level = 2
