[workspace]
resolver = "2"
members = ["compiler", "runtime", "cli"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/iamharshpalsingh/lipi"

[profile.release]
opt-level = 3
lto = "thin"

# Optimise dependencies even in debug builds, so hashing and SQLite stay fast.
[profile.dev.package."*"]
opt-level = 2
