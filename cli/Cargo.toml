[package]
name = "lipi"
description = "The Lipi command-line tool: run, check, test and create Lipi projects"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lipi"
path = "src/main.rs"

[dependencies]
lipi_compiler = { path = "../compiler" }
lipi_runtime = { path = "../runtime" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
semver = "1"
flate2 = "1"
tar = "0.4"
# A fast memory allocator: the interpreter allocates small objects constantly.
mimalloc = { version = "0.1", default-features = false }

[build-dependencies]
embed-resource = "2"
